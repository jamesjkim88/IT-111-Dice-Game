<!doctype html>
<html>
  <head>
    <title>Dice Game</title>
  </head>
  <body>
    <h1>Dice Game</h1>

    <p><strong>Turn:</strong> {{ turn }}</p>
    <p><strong>Point:</strong> {{ point if point else "None" }}</p>

    <p style="color: blue">{{ message }}</p>

    <hr />

    <form method="POST">
      <button type="submit" name="new_game">Start New Game</button>
    </form>

    <br />

    <form method="POST">
      <input type="number" name="roll_value" min="2" max="12" required />
      <button type="submit" name="roll_manual">Roll Manually</button>
    </form>

    <br />

    <form method="POST">
      <button type="submit" name="roll_random">Roll Randomly</button>
    </form>

    {% if finished %}
    <h3 style="color: red">Game Over!</h3>
    {% endif %}
  </body>
</html>
